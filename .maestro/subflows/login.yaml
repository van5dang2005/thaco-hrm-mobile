# Signs in as ${USERNAME} / ${PASSWORD} (MSNV domain left as configured).
# Signs out first when another account is still signed in.
appId: com.thaco.one
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "login-username|home-bell"
    timeout: 240000
- runFlow:
    when:
      visible:
        id: home-bell
    commands:
      - tapOn:
          id: tab-profile
      - scrollUntilVisible:
          element:
            id: profile-signout
      - tapOn:
          id: profile-signout
      # The confirmation's action, not the profile button with the same label.
      - tapOn:
          text: "Đăng xuất"
          below: "(?s)Bạn muốn đăng xuất.*"
          rightOf: "Hủy"
      - extendedWaitUntil:
          visible:
            id: login-username
          timeout: 15000
- tapOn:
    id: login-username
- eraseText: 40
- inputText: ${USERNAME}
# The form slides up with the keyboard; tap the password field only once it has settled.
- waitForAnimationToEnd
- tapOn:
    id: login-password
- waitForAnimationToEnd
- inputText: ${PASSWORD}
- pressKey: Enter
# iOS may offer to save the password to the keychain; that sheet hides the app until dismissed.
- extendedWaitUntil:
    visible: "Not Now|Lúc khác|Để sau|Trang chủ"
    timeout: 30000
- runFlow:
    when:
      visible: "Not Now|Lúc khác|Để sau"
    commands:
      - tapOn: "Not Now|Lúc khác|Để sau"
- extendedWaitUntil:
    visible:
      id: home-bell
    timeout: 30000
# Devices with biometrics get an "enable Face ID / fingerprint" offer after a password sign-in.
- runFlow:
    when:
      visible: "Đăng nhập nhanh"
    commands:
      - tapOn: "Hủy"
